<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Temporal cross-validation and benchmark subset evaluation</title><desc id="desc">Earlier runs produce outcome strata and trajectory embeddings; a subset is then evaluated only on chronologically later unseen runs, comparing subset resolve rate with full-distribution resolve rate using RMSE and maximum error.</desc>
<defs><style>.bg{fill:#f6f0e5}.ink{fill:#18304b;font:600 25px sans-serif}.small{fill:#18304b;font:19px sans-serif}.tiny{fill:#18304b;font:16px sans-serif}.card{fill:#fffaf1;stroke:#18304b;stroke-width:2}.past{fill:#4c78a8}.future{fill:#bf7442}.line{stroke:#18304b;stroke-width:3;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18304b"/></marker></defs>
<rect class="bg" width="1200" height="600" rx="28"/><text class="ink" x="48" y="62">No look-ahead: selection uses only the past, evaluation uses the future</text>
<text class="small" x="62" y="136">Chronological benchmark runs</text>
<rect x="62" y="163" width="165" height="92" rx="16" class="past"/><text x="94" y="203" fill="#fffaf1" font-family="sans-serif" font-size="20" font-weight="600">Earlier run A</text><text x="103" y="232" fill="#fffaf1" font-family="sans-serif" font-size="16">history</text>
<rect x="247" y="163" width="165" height="92" rx="16" class="past"/><text x="279" y="203" fill="#fffaf1" font-family="sans-serif" font-size="20" font-weight="600">Earlier run B</text><text x="288" y="232" fill="#fffaf1" font-family="sans-serif" font-size="16">history</text>
<rect x="432" y="163" width="165" height="92" rx="16" class="past"/><text x="464" y="203" fill="#fffaf1" font-family="sans-serif" font-size="20" font-weight="600">Earlier run C</text><text x="473" y="232" fill="#fffaf1" font-family="sans-serif" font-size="16">history</text>
<path d="M620 209h115" class="line" marker-end="url(#arrow)"/><rect x="748" y="144" width="190" height="128" rx="20" class="card"/><text class="ink" x="778" y="185">Select once</text><text class="tiny" x="777" y="219">outcome groups +</text><text class="tiny" x="777" y="243">trajectory embeddings</text>
<path d="M945 209h55" class="line" marker-end="url(#arrow)"/><rect x="1014" y="163" width="145" height="92" rx="16" class="future"/><text x="1037" y="202" fill="#fffaf1" font-family="sans-serif" font-size="20" font-weight="600">Later run</text><text x="1043" y="231" fill="#fffaf1" font-family="sans-serif" font-size="16">unseen test</text>
<path d="M96 299h820" stroke="#18304b" stroke-width="2" stroke-dasharray="8 8"/><text class="tiny" x="390" y="330">time moves forward</text>
<rect class="card" x="124" y="388" width="420" height="132" rx="18"/><text class="ink" x="154" y="430">Estimate from selected subset</text><text class="small" x="154" y="468">subset resolve rate</text><text class="tiny" x="154" y="498">measured on later run</text>
<rect class="card" x="656" y="388" width="420" height="132" rx="18"/><text class="ink" x="686" y="430">Reference: full distribution</text><text class="small" x="686" y="468">full-suite resolve rate</text><text class="tiny" x="686" y="498">same later run</text>
<path d="M552 453h93" class="line" marker-end="url(#arrow)"/>
<text class="small" x="268" y="563">Compare the gap across future runs: RMSE summarizes typical error; MaxErr exposes a large miss.</text>
</svg>
