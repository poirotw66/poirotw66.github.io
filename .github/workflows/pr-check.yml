name: PR Check

on:
  pull_request:
    branches: [main]

# Astro 7 requires Node >= 22.12
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: |
          npm run test:tags
          npm run test:content
          npm run test:reading-quality
          npm run test:i18n
          npm run test:english-purity
          npm run test:external-links
          npm run test:covers
          npm run test:toc
          npm run test:huahua-callout
          npm run test:home-roadmap

      - name: Build
        run: npm run build

      - name: Homepage Roadmap render matrix
        run: npm run test:home-roadmap:render

      - name: Lighthouse performance budgets
        run: npm run test:performance

      - name: Verify blog PDFs are real files (not LFS pointers)
        run: |
          for f in dist/blog/*/*.pdf; do
            [ -f "$f" ] || continue
            head -c 5 "$f" | grep -q '%PDF-' || {
              echo "Not a valid PDF (LFS pointer?): $f"
              head -3 "$f"
              exit 1
            }
          done
