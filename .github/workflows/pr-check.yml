name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          performance=false
          homepage=false

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/pr-check.yml|astro.config.*|lighthouserc*.cjs|package.json|package-lock.json|public/css/*|public/js/*|src/components/*|src/layouts/*|src/pages/*|src/styles/*)
                performance=true
                ;;
            esac

            case "$file" in
              public/css/home.css|public/js/home-*.js|scripts/home-*.mjs|src/components/Home*.astro|src/components/pages/HomePageContent.astro|src/data/homeBrand.ts|src/data/homeRoadmap.ts|src/pages/index.astro|src/pages/en/index.astro)
                homepage=true
                performance=true
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")

          echo "performance=$performance" >> "$GITHUB_OUTPUT"
          echo "homepage=$homepage" >> "$GITHUB_OUTPUT"
          echo "Performance checks: $performance"
          echo "Homepage render checks: $homepage"

      - name: Unit tests
        run: |
          npm run test:tags
          npm run test:content
          npm run test:markdown-emphasis
          npm run test:markdown-emphasis-normalizer
          npm run test:blog-format
          npm run test:reading-quality
          npm run test:paper-comprehension
          npm run test:paper-essence
          npm run test:paper-paths
          npm run test:i18n
          npm run test:english-purity
          npm run test:external-links
          npm run test:covers
          npm run test:toc
          npm run test:huahua-callout
          npm run test:image-dimensions
          npm run test:home-roadmap
          npm run test:home-brand
          npm run test:studio-updates
          npm run test:performance-assets

      - name: Build
        run: |
          npm run build

      - name: Homepage Roadmap render matrix
        if: steps.changes.outputs.homepage == 'true'
        run: |
          npm run test:home-roadmap:render

      - name: Lighthouse PR smoke budgets
        if: steps.changes.outputs.performance == 'true'
        run: npm run test:performance:pr

      - name: Verify blog PDFs are real files (not LFS pointers)
        run: |
          for f in dist/blog/*/*.pdf; do
            [ -f "$f" ] || continue
            head -c 5 "$f" | grep -q '%PDF-' || {
              echo "Not a valid PDF (LFS pointer?): $f"
              head -3 "$f"
              exit 1
            }
          done
