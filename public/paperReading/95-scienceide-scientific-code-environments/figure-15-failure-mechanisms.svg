<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Trajectory review distinguishes wrong edits and incomplete deliveries</title><desc id="desc">Reference-convention mismatches account for 71.4 percent of Fable and 64.9 percent of Astra task-balanced failures; three task examples illustrate localization errors and a separate case of incomplete delivery.</desc>
<rect width="1200" height="640" rx="28" fill="#f7f3e9"/>
<text x="58" y="66" fill="#14263d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Passing a local run is not the same as repairing the assigned science</text>
<text x="58" y="106" fill="#546274" font-family="Arial, sans-serif" font-size="21">Figure 15 · model-assisted review of 358 attempts from Fable 5.1 and Astra</text>
<rect x="58" y="136" width="1084" height="155" rx="18" fill="#e8edf1"/>
<text x="84" y="176" fill="#39485a" font-family="Arial, sans-serif" font-size="20">Task-balanced share of unsuccessful cases attributed to reference-convention mismatch</text>
<text x="84" y="226" fill="#14263d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fable 5.1</text><rect x="236" y="205" width="600" height="28" rx="14" fill="#d1d8df"/><rect x="236" y="205" width="428" height="28" rx="14" fill="#b66c3d"/><text x="678" y="228" fill="#14263d" font-family="Arial, sans-serif" font-size="21" font-weight="700">71.4%</text>
<text x="84" y="270" fill="#14263d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Astra</text><rect x="236" y="249" width="600" height="28" rx="14" fill="#d1d8df"/><rect x="236" y="249" width="389" height="28" rx="14" fill="#4b789f"/><text x="640" y="272" fill="#14263d" font-family="Arial, sans-serif" font-size="21" font-weight="700">64.9%</text>
<g font-family="Arial, sans-serif"><rect x="58" y="320" width="342" height="220" rx="18" fill="#edf0ec"/><text x="82" y="363" fill="#14263d" font-size="25" font-weight="700">T013 · timestep</text><text x="82" y="408" fill="#39485a" font-size="20">Runnable repair omits</text><text x="82" y="438" fill="#39485a" font-size="20">previous-step retention;</text><text x="82" y="468" fill="#39485a" font-size="20">divergence appears at a</text><text x="82" y="498" fill="#39485a" font-size="20">periodic update.</text>
<rect x="429" y="320" width="342" height="220" rx="18" fill="#edf0ec"/><text x="453" y="363" fill="#14263d" font-size="25" font-weight="700">T035 · tracer</text><text x="453" y="408" fill="#39485a" font-size="20">A reconstructed coefficient</text><text x="453" y="438" fill="#39485a" font-size="20">table truncates one value;</text><text x="453" y="468" fill="#39485a" font-size="20">one tracer diverges while</text><text x="453" y="498" fill="#39485a" font-size="20">another remains aligned.</text>
<rect x="800" y="320" width="342" height="220" rx="18" fill="#edf0ec"/><text x="824" y="363" fill="#14263d" font-size="25" font-weight="700">T002 · delivery</text><text x="824" y="408" fill="#39485a" font-size="20">The intended edit is correct,</text><text x="824" y="438" fill="#39485a" font-size="20">but four required control</text><text x="824" y="468" fill="#39485a" font-size="20">output groups are missing.</text><text x="824" y="498" fill="#39485a" font-size="20">The run is incomplete.</text></g>
<text x="58" y="588" fill="#39485a" font-family="Arial, sans-serif" font-size="20">Review labels are evidence-supported mechanisms, not isolated causes; 17 failed attempts remained unresolved.</text>
</svg>
