name: Site Validation

on:
  workflow_call:
    inputs:
      base-sha:
        description: Commit before the changes to validate
        required: true
        type: string
      head-sha:
        description: Commit containing the changes to validate
        required: true
        type: string
      upload-pages-artifact:
        description: Upload the validated build for GitHub Pages deployment
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          performance=false
          homepage=false
          changed_files=""

          # A missing comparison ref must run the optional checks, not skip them.
          if [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            performance=true
            homepage=true
          else
            changed_files=$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          fi

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*.yml|astro.config.*|lighthouserc*.cjs|package.json|package-lock.json|public/*|src/components/*|src/content/*|src/layouts/*|src/pages/*|src/styles/*|src/scripts/*|src/utils/*|src/data/*)
                performance=true
                ;;
            esac

            case "$file" in
              public/css/home.css|public/js/home-*.js|scripts/home-*.mjs|src/components/Home*.astro|src/components/pages/HomePageContent.astro|src/data/homeBrand.ts|src/data/homeRoadmap.ts|src/pages/index.astro|src/pages/en/index.astro)
                homepage=true
                performance=true
                ;;
            esac
          done <<< "$changed_files"

          echo "performance=$performance" >> "$GITHUB_OUTPUT"
          echo "homepage=$homepage" >> "$GITHUB_OUTPUT"
          echo "Performance checks: $performance"
          echo "Homepage render checks: $homepage"

      - name: Unit tests
        run: |
          npm run test:tags
          npm run test:content
          npm run test:markdown-emphasis
          npm run test:math
          npm run test:markdown-emphasis-normalizer
          npm run test:blog-format
          npm run test:blog-index
          npm run test:blog-lanes
          npm run test:role-comparison
          npm run test:reading-quality
          npm run test:skills
          npm run test:paper-comprehension
          npm run test:discovery
          npm run test:paper-essence
          npm run test:paper-paths
          npm run test:i18n
          npm run test:english-purity
          npm run test:image-budgets
          npm run test:external-links
          npm run test:covers
          npm run test:toc
          npm run test:huahua-callout
          npm run test:image-dimensions
          npm run test:home-roadmap
          npm run test:home-brand
          npm run test:studio-updates
          npm run test:performance-assets
          npm run test:finalize-sitemap
          npm run test:legacy-redirects
          npm run test:analytics
          npm run test:search-state
          npm run test:legacy-json
          npm run test:content-advisories

      - name: Build
        run: |
          npm run build:site

      - name: Legacy JSON compatibility
        run: npm run check:legacy-json

      - name: Content advisory delta report
        if: ${{ !cancelled() }}
        run: npm run report:content-advisories -- --output="${{ runner.temp }}/content-advisories.json"

      - name: Preserve content advisory report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: content-advisories
          path: ${{ runner.temp }}/content-advisories.json
          if-no-files-found: warn
          retention-days: 30

      - name: Discovery failure recovery
        run: npm run test:discovery:browser

      - name: Search URL state
        run: npm run test:search-state:browser

      - name: Analytics browser behavior
        run: npm run test:analytics:browser

      - name: Mobile reading and discovery layout
        run: npm run test:mobile-layout

      - name: Homepage Roadmap render matrix
        if: steps.changes.outputs.homepage == 'true'
        run: |
          npm run test:home-roadmap:render

      - name: Lighthouse PR smoke budgets
        if: steps.changes.outputs.performance == 'true'
        run: npm run test:performance:pr

      - name: Report Lighthouse audit failures
        if: failure() && steps.changes.outputs.performance == 'true'
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, existsSync } from 'node:fs';
          if (existsSync('.lighthouseci')) for (const file of readdirSync('.lighthouseci').filter(file => /^lhr-.*\.json$/.test(file))) {
            const report = JSON.parse(readFileSync(`.lighthouseci/${file}`, 'utf8'));
            for (const category of Object.values(report.categories ?? {})) for (const ref of category.auditRefs ?? []) {
              const audit = report.audits?.[ref.id];
              if (audit?.score !== null && audit?.score < 1) console.log(JSON.stringify({ url: report.finalUrl, category: category.id, audit: ref.id, score: audit.score, details: audit.details }));
            }
          }
          JS

      - name: Verify blog PDFs are real files (not LFS pointers)
        run: |
          for f in dist/blog/*/*.pdf; do
            [ -f "$f" ] || continue
            head -c 5 "$f" | grep -q '%PDF-' || {
              echo "Not a valid PDF (LFS pointer?): $f"
              head -3 "$f"
              exit 1
            }
          done

      - name: Upload validated Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
