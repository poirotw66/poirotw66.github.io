<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="t d">
<title id="t">Focal retrospective study flow</title><desc id="d">A seeded stratified sample of sixteen from twenty-two static tasks flows through no-skill and with-skill conditions, two repeats per task and condition, then sixty-four reports and three analyses.</desc>
<rect width="1100" height="480" rx="22" fill="#fbf7ef"/><text x="52" y="56" fill="#17324d" font-family="Arial,sans-serif" font-size="26" font-weight="700">Focal archive: task selection → paired advice → grading → analysis</text>
<rect x="52" y="126" width="185" height="118" rx="16" fill="#eaf0f3" stroke="#17324d" stroke-width="2"/><text x="78" y="166" fill="#17324d" font-family="Arial,sans-serif" font-size="19" font-weight="700">22 static tasks</text><text x="78" y="202" fill="#536773" font-family="Arial,sans-serif" font-size="16">seeded, stratified</text><text x="78" y="226" fill="#536773" font-family="Arial,sans-serif" font-size="16">selection: 16</text>
<path d="M237 184 H284" stroke="#33708b" stroke-width="4"/><path d="m273 172 14 12-14 12" fill="none" stroke="#33708b" stroke-width="4"/>
<rect x="294" y="104" width="236" height="132" rx="16" fill="#fff" stroke="#33708b" stroke-width="2"/><text x="320" y="142" fill="#17324d" font-family="Arial,sans-serif" font-size="18" font-weight="700">No-skill arm</text><text x="320" y="178" fill="#536773" font-family="Arial,sans-serif" font-size="16">2 repeats / task</text><text x="320" y="207" fill="#536773" font-family="Arial,sans-serif" font-size="16">32 reports</text>
<rect x="294" y="260" width="236" height="132" rx="16" fill="#fff" stroke="#b85c32" stroke-width="2"/><text x="320" y="298" fill="#8c3e20" font-family="Arial,sans-serif" font-size="18" font-weight="700">With-skill arm</text><text x="320" y="334" fill="#536773" font-family="Arial,sans-serif" font-size="16">2 repeats / task</text><text x="320" y="363" fill="#536773" font-family="Arial,sans-serif" font-size="16">32 reports</text>
<path d="M530 170 C570 170 560 234 606 234 M530 326 C570 326 560 234 606 234" fill="none" stroke="#7b8790" stroke-width="3"/><rect x="614" y="164" width="190" height="140" rx="16" fill="#f1e6d8" stroke="#17324d" stroke-width="2"/><text x="640" y="206" fill="#17324d" font-family="Arial,sans-serif" font-size="20" font-weight="700">64 reports</text><text x="640" y="244" fill="#536773" font-family="Arial,sans-serif" font-size="16">328 rubric</text><text x="640" y="270" fill="#536773" font-family="Arial,sans-serif" font-size="16">decisions</text>
<path d="M804 234 H850" stroke="#33708b" stroke-width="4"/><path d="m839 222 14 12-14 12" fill="none" stroke="#33708b" stroke-width="4"/>
