<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="t d">
<title id="t">Task concentration and ceiling effects in the focal estimate</title><desc id="d">Among sixteen static tasks, six improve, two decline by five points, and eight stay tied at the 100-point ceiling; task S1 alone adds 42.5 points and removing it leaves a 2.42-point mean.</desc>
<rect width="1100" height="500" rx="22" fill="#fbf7ef"/><text x="52" y="57" fill="#17324d" font-family="Arial,sans-serif" font-size="27" font-weight="700">Sixteen task pairs: a positive average is concentrated and ceiling-bound</text>
<g font-family="Arial,sans-serif" font-size="17" fill="#17324d">
<text x="66" y="126" font-weight="700">S1</text><rect x="160" y="99" width="690" height="36" rx="8" fill="#b85c32"/><text x="875" y="125" font-weight="700" fill="#8c3e20">+42.5</text>
<text x="66" y="179">5 other gains</text><rect x="160" y="152" width="244" height="36" rx="8" fill="#6f9aab"/><text x="429" y="178">positive, smaller</text>
<text x="66" y="232">2 declines</text><rect x="160" y="205" width="82" height="36" rx="8" fill="#d8b5a1"/><text x="260" y="231">−5 each</text>
<text x="66" y="285">8 ties</text><rect x="160" y="258" width="600" height="36" rx="8" fill="#dce6e8"/><text x="184" y="283">all 100 → 100 (no headroom)</text>
</g>
<line x1="52" y1="324" x2="1048" y2="324" stroke="#d5c8b7" stroke-width="2"/><text x="68" y="374" fill="#17324d" font-family="Arial,sans-serif" font-size="21" font-weight="700">Original mean difference</text><text x="388" y="374" fill="#8c3e20" font-family="Arial,sans-serif" font-size="24" font-weight="700">+4.92</text><text x="530" y="374" fill="#536773" font-family="Arial,sans-serif" font-size="18">95% task-bootstrap interval [0.31, 10.86]</text>
<text x="68" y="426" fill="#17324d" font-family="Arial,sans-serif" font-size="21" font-weight="700">Remove S1</text><text x="388" y="426" fill="#8c3e20" font-family="Arial,sans-serif" font-size="24" font-weight="700">+2.42</text><text x="530" y="426" fill="#536773" font-family="Arial,sans-serif" font-size="18">descriptive sensitivity across the other 15 tasks</text>
<text x="68" y="470" fill="#536773" font-family="Arial,sans-serif" font-size="15">Reward tracks the original rubric; it is not a migration-correctness or repair-pass rate.</text></svg>
