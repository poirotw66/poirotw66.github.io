<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Outcome grouping and within-group geometric selection</title><desc id="desc">Three historical outcome groups are kept in their original proportions. Within each group, a central trajectory representative is selected deterministically from a semantic embedding space.</desc>
<defs><style>.bg{fill:#f6f0e5}.ink{fill:#18304b;font:600 25px sans-serif}.small{fill:#18304b;font:19px sans-serif}.tiny{fill:#18304b;font:16px sans-serif}.group{fill:#fffaf1;stroke:#18304b;stroke-width:2}.blue{fill:#4c78a8}.copper{fill:#bf7442}.navy{fill:#18304b}.muted{fill:#a8bac9}.arrow{stroke:#18304b;stroke-width:3;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" class="navy"/></marker></defs>
<rect class="bg" width="1200" height="600" rx="28"/><text class="ink" x="48" y="62">Two signals answer two different questions</text>
<text class="small" x="66" y="119">1. Keep historical outcome proportions</text>
<rect class="group" x="48" y="148" width="280" height="300" rx="20"/><text class="ink" x="76" y="190">Pass count: low</text><text class="tiny" x="76" y="221">difficult / rarely solved</text><circle cx="110" cy="280" r="12" class="blue"/><circle cx="155" cy="309" r="12" class="muted"/><circle cx="207" cy="270" r="12" class="blue"/><circle cx="260" cy="321" r="12" class="copper"/><circle cx="124" cy="371" r="12" class="muted"/><circle cx="228" cy="385" r="12" class="blue"/>
<rect class="group" x="359" y="148" width="280" height="300" rx="20"/><text class="ink" x="386" y="190">Pass count: mixed</text><text class="tiny" x="386" y="221">inconsistent across runs</text><circle cx="414" cy="280" r="12" class="blue"/><circle cx="470" cy="309" r="12" class="muted"/><circle cx="517" cy="270" r="12" class="copper"/><circle cx="570" cy="321" r="12" class="blue"/><circle cx="425" cy="371" r="12" class="muted"/><circle cx="544" cy="385" r="12" class="copper"/>
<rect class="group" x="670" y="148" width="280" height="300" rx="20"/><text class="ink" x="698" y="190">Pass count: high</text><text class="tiny" x="698" y="221">easy / usually solved</text><circle cx="721" cy="280" r="12" class="blue"/><circle cx="780" cy="309" r="12" class="muted"/><circle cx="828" cy="270" r="12" class="copper"/><circle cx="884" cy="321" r="12" class="blue"/><circle cx="734" cy="371" r="12" class="muted"/><circle cx="851" cy="385" r="12" class="blue"/>
<path d="M100 477h795" class="arrow" marker-end="url(#a)"/><text class="tiny" x="320" y="515">subset slots follow each group's share in the full benchmark</text>
<text class="small" x="989" y="119">2. Choose typical behavior inside each group</text>
<circle cx="1055" cy="220" r="52" fill="#e4edf5" stroke="#4c78a8" stroke-width="2"/><circle cx="1034" cy="203" r="7" class="blue"/><circle cx="1074" cy="199" r="7" class="muted"/><circle cx="1044" cy="239" r="7" class="copper"/><circle cx="1081" cy="239" r="7" class="blue"/><circle cx="1055" cy="220" r="11" class="navy"/><circle cx="1055" cy="220" r="18" fill="none" stroke="#bf7442" stroke-width="3"/><text class="tiny" x="988" y="298">nearest to group centroid</text><path d="M1055 321v51" class="arrow" marker-end="url(#a)"/><rect x="990" y="387" width="132" height="60" rx="15" class="navy"/><text fill="#fffaf1" font-family="sans-serif" font-size="17" x="1006" y="424">fixed subset</text><text class="tiny" x="978" y="487">not a random draw</text>
<text class="small" x="48" y="565">Outcome strata preserve difficulty; trajectory geometry picks representative behavior within strata.</text>
</svg>
