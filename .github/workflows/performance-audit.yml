name: Full Lighthouse Audit

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-lighthouse-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build:site

      - name: Run desktop Lighthouse matrix
        id: desktop
        run: npm run test:performance:desktop

      - name: Preserve desktop Lighthouse reports
        if: ${{ !cancelled() && (steps.desktop.outcome == 'success' || steps.desktop.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-desktop
          path: |
            .lighthouseci/*.json
            .lighthouseci/*.html
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Run mobile Lighthouse matrix
        id: mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:performance:mobile

      - name: Preserve mobile Lighthouse reports
        if: ${{ !cancelled() && (steps.mobile.outcome == 'success' || steps.mobile.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile
          path: |
            .lighthouseci/*.json
            .lighthouseci/*.html
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
