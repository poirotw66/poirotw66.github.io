<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f5f0e5"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#53647a}.num{font-size:24px;font-weight:700}.panel{fill:#fffdf8;stroke:#d8d1c2;stroke-width:2}.navy{fill:#173557}.blue{fill:#dbe8f3;stroke:#6c8fb3;stroke-width:2}.copper{fill:#b8753f}.muted{fill:#eef0ef;stroke:#c5ccd0;stroke-width:2}.ok{fill:#e1ece6;stroke:#789b87;stroke-width:2}</style><text x="58" y="60" class="title">Held-out results keep coverage and safety denominators visible</text><text x="58" y="92" class="sub">Each number answers a different question in the aggregate-only simulator.</text>
<rect x="60" y="140" width="510" height="305" rx="18" class="panel"/><text x="92" y="184" class="head">Support gates</text><text x="92" y="236" class="body">Scheduled regime–component units</text><text x="460" y="239" class="num" text-anchor="end">72</text><rect x="92" y="258" width="400" height="22" rx="11" fill="#d9dee0"/><rect x="92" y="258" width="306" height="22" rx="11" fill="#537da3"/><text x="92" y="318" class="body">Reference-admitted</text><text x="492" y="321" class="num" text-anchor="end">55 / 72</text><text x="92" y="365" class="body">Still runtime-admitted</text><text x="492" y="368" class="num" text-anchor="end">54 / 55</text><text x="92" y="415" class="small">55 units represent 20 of 24 physical components.</text>
<rect x="610" y="140" width="530" height="305" rx="18" class="panel"/><text x="642" y="184" class="head">Independent null and exposure test</text><text x="642" y="237" class="body">Stable false admissions</text><text x="1103" y="240" class="num" text-anchor="end">0 / 20</text><text x="642" y="270" class="small">One-sided exact 95% upper bound 0.1391; frozen tolerance 0.20.</text><line x1="642" y1="296" x2="1106" y2="296" stroke="#ded7ca" stroke-width="2"/><text x="642" y="337" class="body">Cell-model minus traffic-model NLL</text><text x="642" y="372" class="num">0.1264 nats / row</text><text x="642" y="403" class="small">95% component-cluster interval [0.0593, 0.1918]</text><text x="58" y="505" class="small">Formal held-out: 1,440 cases, 21,600 partition rows; rows cluster within 20 represented physical components.</text></svg>