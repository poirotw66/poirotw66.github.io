<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f5f0e5"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#53647a}.num{font-size:24px;font-weight:700}.panel{fill:#fffdf8;stroke:#d8d1c2;stroke-width:2}.navy{fill:#173557}.blue{fill:#dbe8f3;stroke:#6c8fb3;stroke-width:2}.copper{fill:#b8753f}.muted{fill:#eef0ef;stroke:#c5ccd0;stroke-width:2}.ok{fill:#e1ece6;stroke:#789b87;stroke-width:2}</style><text x="58" y="60" class="title">A clean stream can be outside the detector's null</text><text x="58" y="92" class="sub">All 45 partitions had no planted fault; only λ₀ = 7 matched the frozen reference regime.</text>
<g transform="translate(78 150)"><rect width="320" height="280" rx="18" class="panel"/><text x="160" y="52" class="head" text-anchor="middle">Demand regime λ₀ = 5</text><text x="160" y="90" class="small" text-anchor="middle">Shifted from reference</text><rect x="50" y="130" width="220" height="38" rx="12" fill="#ddd"/><rect x="50" y="130" width="220" height="38" rx="12" fill="#bd7944"/><text x="160" y="225" class="num" text-anchor="middle">15 / 15</text><text x="160" y="255" class="small" text-anchor="middle">alarms · fault-null</text></g>
<g transform="translate(440 150)"><rect width="320" height="280" rx="18" class="ok"/><text x="160" y="52" class="head" text-anchor="middle">Demand regime λ₀ = 7</text><text x="160" y="90" class="small" text-anchor="middle">Matches frozen reference</text><rect x="50" y="130" width="220" height="38" rx="12" fill="#d6ddd9"/><text x="160" y="225" class="num" text-anchor="middle">0 / 15</text><text x="160" y="255" class="small" text-anchor="middle">alarms · detector null</text></g>
<g transform="translate(802 150)"><rect width="320" height="280" rx="18" class="panel"/><text x="160" y="52" class="head" text-anchor="middle">Demand regime λ₀ = 9</text><text x="160" y="90" class="small" text-anchor="middle">Shifted from reference</text><rect x="50" y="130" width="220" height="38" rx="12" fill="#ddd"/><rect x="50" y="130" width="205" height="38" rx="12" fill="#bd7944"/><text x="160" y="225" class="num" text-anchor="middle">14 / 15</text><text x="160" y="255" class="small" text-anchor="middle">alarms · fault-null</text></g>
<text x="58" y="500" class="small">The stratified pattern is descriptive: no detector-sensitivity threshold was preregistered. These alarms do not replace the separate false-admission endpoint.</text></svg>