<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Different paths to unsuccessful agent episodes</title><desc id="desc">Reported contrasts show Qwen and MiniMax with substantial budget exhaustion and long unsuccessful episodes, while Haiku has no recorded budget timeouts but many at-or-below-baseline returns.</desc>
<rect width="1200" height="540" rx="28" fill="#f7f3e9"/>
<text x="58" y="70" fill="#14263d" font-family="Arial, sans-serif" font-size="34" font-weight="700">A failed episode can be long, short, or stuck near baseline</text>
<text x="58" y="112" fill="#546274" font-family="Arial, sans-serif" font-size="22">Distinct reported diagnostics from Figure 13 · observed behavior, not inferred cause</text>
<g font-family="Arial, sans-serif">
<rect x="58" y="150" width="340" height="300" rx="22" fill="#e8edf1"/><text x="84" y="198" fill="#14263d" font-size="28" font-weight="700">Qwen3.8 Max</text><text x="84" y="244" fill="#546274" font-size="19">Selected attempts</text><text x="84" y="300" fill="#14263d" font-size="23">37.3%</text><rect x="84" y="316" width="270" height="18" rx="9" fill="#d1d8df"/><rect x="84" y="316" width="101" height="18" rx="9" fill="#b66c3d"/><text x="84" y="374" fill="#546274" font-size="19">budget exhausted</text><text x="84" y="420" fill="#14263d" font-size="23" font-weight="700">48.5 min</text><text x="202" y="420" fill="#546274" font-size="18">mean unsuccessful run</text>
<rect x="430" y="150" width="340" height="300" rx="22" fill="#e8edf1"/><text x="456" y="198" fill="#14263d" font-size="28" font-weight="700">Claude Haiku 4.5</text><text x="456" y="244" fill="#546274" font-size="19">Selected attempts</text><text x="456" y="300" fill="#14263d" font-size="23">0 recorded</text><rect x="456" y="316" width="270" height="18" rx="9" fill="#d1d8df"/><text x="456" y="374" fill="#546274" font-size="19">budget timeouts</text><text x="456" y="420" fill="#14263d" font-size="23" font-weight="700">74.9%</text><text x="534" y="420" fill="#546274" font-size="18">at or below baseline</text>
<rect x="802" y="150" width="340" height="300" rx="22" fill="#e8edf1"/><text x="828" y="198" fill="#14263d" font-size="28" font-weight="700">MiniMax-M3</text><text x="828" y="244" fill="#546274" font-size="19">Selected attempts</text><text x="828" y="300" fill="#14263d" font-size="23">31.6%</text><rect x="828" y="316" width="270" height="18" rx="9" fill="#d1d8df"/><rect x="828" y="316" width="85" height="18" rx="9" fill="#b66c3d"/><text x="828" y="374" fill="#546274" font-size="19">budget exhausted</text><text x="828" y="420" fill="#14263d" font-size="23" font-weight="700">34.1 min</text><text x="946" y="420" fill="#546274" font-size="18">mean unsuccessful run</text>
</g>
<text x="58" y="500" fill="#39485a" font-family="Arial, sans-serif" font-size="20">Timeout rate alone cannot say why an agent stopped; repeat instability is a separate property.</text>
</svg>
