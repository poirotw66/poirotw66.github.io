<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d">
<title id="t">Parent path slips past a prefix-based containment guard</title><desc id="d">A lexical guard rejects strings beginning with two dots and a separator, but the exact parent path remains accepted and resolves outside the intended directory.</desc>
<rect width="1100" height="420" rx="22" fill="#fbf7ef"/><text x="56" y="62" fill="#17324d" font-family="Arial,sans-serif" font-size="28" font-weight="700">A boundary test the score missed</text>
<rect x="58" y="106" width="390" height="236" rx="18" fill="#eaf0f3" stroke="#17324d" stroke-width="2"/><text x="84" y="150" fill="#17324d" font-family="monospace" font-size="20">intended root</text><rect x="90" y="180" width="326" height="116" rx="14" fill="#fff" stroke="#33708b" stroke-width="3"/><text x="116" y="225" fill="#17324d" font-family="monospace" font-size="20">/workspace/plugins</text><text x="116" y="265" fill="#7b8790" font-family="Arial,sans-serif" font-size="16">allowed descendants stay inside</text>
<path d="M448 220 H540" stroke="#b85c32" stroke-width="4"/><path d="m528 208 14 12-14 12" fill="none" stroke="#b85c32" stroke-width="4"/>
<rect x="554" y="106" width="488" height="236" rx="18" fill="#fff" stroke="#b85c32" stroke-width="2"/><text x="582" y="150" fill="#17324d" font-family="Arial,sans-serif" font-size="18" font-weight="700">PROPOSED CHECK</text><text x="582" y="196" fill="#17324d" font-family="monospace" font-size="18">rel === "" ||</text><text x="582" y="226" fill="#17324d" font-family="monospace" font-size="18">(!isAbsolute(rel) &amp;&amp;</text><text x="582" y="256" fill="#17324d" font-family="monospace" font-size="18"> !rel.startsWith(".." + sep))</text><rect x="582" y="280" width="198" height="42" rx="12" fill="#f6ded0"/><text x="604" y="308" fill="#8c3e20" font-family="monospace" font-size="19" font-weight="700">rel = ".." → PASS</text><text x="807" y="307" fill="#8c3e20" font-family="Arial,sans-serif" font-size="17" font-weight="700">parent escapes root</text>
</svg>
