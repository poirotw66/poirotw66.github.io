# Bloss0m project TAKT config
#
# Division of labor:
# - Codex (gpt-5.6-sol): planning, review, assistant dialogue
# - Cursor Agent CLI: coding / fix labor

provider: cursor
base_branch: main
auto_pr: true
concurrency: 1
vcs_provider: github

# Interactive planning / instruct / retry → Codex Sol
takt_providers:
  assistant:
    provider: codex
    model: gpt-5.6-sol

# Interactive planning loads project conventions
assistant:
  init_files:
    - AGENTS.md

# Route workflow steps without duplicating YAML
provider_routing:
  personas:
    planner:
      provider: codex
      model: gpt-5.6-sol
    supervisor:
      provider: codex
      model: gpt-5.6-sol
    ai-antipattern-reviewer:
      provider: codex
      model: gpt-5.6-sol
    frontend-reviewer:
      provider: codex
      model: gpt-5.6-sol
    coding-reviewer:
      provider: codex
      model: gpt-5.6-sol
    pure-reviewer:
      provider: codex
      model: gpt-5.6-sol
    architecture-reviewer:
      provider: codex
      model: gpt-5.6-sol
    security-reviewer:
      provider: codex
      model: gpt-5.6-sol
    coder:
      provider: cursor
  tags:
    plan:
      provider: codex
      model: gpt-5.6-sol
    review:
      provider: codex
      model: gpt-5.6-sol
    coding:
      provider: cursor

# Codex SDK needs network for repo context / docs when planning & reviewing
provider_options:
  codex:
    network_access: true

# Node cache prep for worktree runs
runtime:
  prepare:
    - node
