# 僅防誤用，本專案以 Astro 建置。
# Jekyll config kept so "Deploy from a branch" does not parse this repo as Jekyll.
# Prefer: Settings → Pages → Source: GitHub Actions.
# If branch deploy is used, exclude Astro/Node dirs to avoid "Invalid YAML" errors.

exclude:
  - src
  - node_modules
  - dist
  - .astro
  - .github
  - .cursor
  - "*.astro"
  - "*.md"
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tsconfig.json
  - README.md
