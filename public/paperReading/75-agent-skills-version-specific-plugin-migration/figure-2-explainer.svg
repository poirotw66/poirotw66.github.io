<rect x="860" y="204" width="190" height="90" rx="14" fill="#fff" stroke="#7b8790"/><text x="885" y="242" fill="#17324d" font-family="Arial,sans-serif" font-size="16" font-weight="700">RQ2 · contracts</text><text x="885" y="269" fill="#536773" font-family="Arial,sans-serif" font-size="14">all + bounded review</text>
