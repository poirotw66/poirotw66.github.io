# Jekyll config so "Deploy from a branch" does not parse Astro source.
# This repo is built with Astro; use Settings → Pages → Source: GitHub Actions.
# If branch deploy is used, exclude Astro/Node dirs to avoid "Invalid YAML" errors.

exclude:
  - src
  - node_modules
  - dist
  - .astro
  - .github
  - .cursor
  - "*.astro"
  - "*.md"
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tsconfig.json
  - README.md
