<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f5f0e5"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#53647a}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#53647a}.num{font-size:24px;font-weight:700}.panel{fill:#fffdf8;stroke:#d8d1c2;stroke-width:2}.navy{fill:#173557}.blue{fill:#dbe8f3;stroke:#6c8fb3;stroke-width:2}.copper{fill:#b8753f}.muted{fill:#eef0ef;stroke:#c5ccd0;stroke-width:2}.ok{fill:#e1ece6;stroke:#789b87;stroke-width:2}</style><text x="58" y="60" class="title">A claim ledger keeps unlike decisions separate</text><text x="58" y="92" class="sub">Redrawn from the paper's frozen result grammar; one state cannot stand in for another.</text>
<g transform="translate(55 130)">
<rect width="1090" height="74" rx="12" class="panel"/><rect width="13" height="74" rx="6" class="navy"/><text x="38" y="31" class="head">Execution</text><text x="260" y="30" class="body">Did the locked protocol run and validate?</text><text x="260" y="55" class="small">EXECUTED / NOT EXECUTED</text><text x="790" y="43" class="body">Execution is not scientific success</text>
<g transform="translate(0 92)"><rect width="1090" height="74" rx="12" class="panel"/><rect width="13" height="74" rx="6" class="copper"/><text x="38" y="31" class="head">Operational safety</text><text x="260" y="30" class="body">Did the false-admission upper bound meet 0.20?</text><text x="260" y="55" class="small">SAFETY CONFIRMED / NOT CONFIRMED</text><text x="790" y="43" class="body">Not a 5% false-alarm guarantee</text></g>
<g transform="translate(0 184)"><rect width="1090" height="74" rx="12" class="panel"/><rect width="13" height="74" rx="6" fill="#7598b9"/><text x="38" y="31" class="head">Coverage</text><text x="260" y="30" class="body">Where was evaluation supported?</text><text x="260" y="55" class="small">Counts, rates, exact intervals</text><text x="790" y="43" class="body">No post-hoc population pass threshold</text></g>
<g transform="translate(0 276)"><rect width="1090" height="74" rx="12" class="panel"/><rect width="13" height="74" rx="6" fill="#517aa1"/><text x="38" y="31" class="head">Structural hypotheses</text><text x="260" y="30" class="body">Which operationalization predicts signal?</text><text x="260" y="55" class="small">Separate PASS / FAIL / NOT ESTIMABLE</text><text x="790" y="43" class="body">No combined scientific label</text></g>
<g transform="translate(0 368)"><rect width="1090" height="74" rx="12" class="panel"/><rect width="13" height="74" rx="6" fill="#8a9b88"/><text x="38" y="31" class="head">Maintenance</text><text x="260" y="30" class="body">Did the detector request a refresh?</text><text x="260" y="55" class="small">Alarm and refresh state</text><text x="790" y="43" class="body">An alarm is not a fault diagnosis</text></g>
</g><text x="58" y="625" class="small">The paper's Table 1 separates execution, safety, descriptive coverage, structural hypotheses, and maintenance.</text></svg>