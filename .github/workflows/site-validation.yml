name: Site Validation

on:
  workflow_call:
    inputs:
      base-sha:
        description: Commit before the changes to validate
        required: true
        type: string
      head-sha:
        description: Commit containing the changes to validate
        required: true
        type: string
      upload-pages-artifact:
        description: Upload the validated build for GitHub Pages deployment
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: node scripts/classify-site-changes.mjs

      - name: Unit tests
        run: npm run test:unit

      - name: Restore image derivative cache
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: .cache/image-derivatives
          key: ${{ runner.os }}-${{ runner.arch }}-image-derivatives-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-image-derivatives-v1-

      - name: Build
        # A cache hit only restores candidates; the generator validates every entry.
        # All build and delivered-image gates still run.
        run: |
          npm run build:site

      - name: Legacy JSON compatibility
        run: npm run check:legacy-json

      - name: Content advisory delta report
        if: ${{ !cancelled() }}
        run: npm run report:content-advisories -- --output="${{ runner.temp }}/content-advisories.json"

      - name: Preserve content advisory report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: content-advisories
          path: ${{ runner.temp }}/content-advisories.json
          if-no-files-found: warn
          retention-days: 30

      - name: Discovery failure recovery
        run: npm run test:discovery:browser

      - name: Search URL state
        run: npm run test:search-state:browser

      - name: Analytics browser behavior
        run: npm run test:analytics:browser

      - name: Mobile reading and discovery layout
        run: npm run test:mobile-layout

      - name: Homepage Roadmap render matrix
        if: steps.changes.outputs.homepage == 'true'
        run: |
          npm run test:home-roadmap:render

      - name: Lighthouse PR smoke budgets
        if: steps.changes.outputs.performance == 'true'
        run: npm run test:performance:pr

      - name: Report Lighthouse audit failures
        if: failure() && steps.changes.outputs.performance == 'true'
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, existsSync } from 'node:fs';
          if (existsSync('.lighthouseci')) for (const file of readdirSync('.lighthouseci').filter(file => /^lhr-.*\.json$/.test(file))) {
            const report = JSON.parse(readFileSync(`.lighthouseci/${file}`, 'utf8'));
            for (const category of Object.values(report.categories ?? {})) for (const ref of category.auditRefs ?? []) {
              const audit = report.audits?.[ref.id];
              if (audit?.score !== null && audit?.score < 1) console.log(JSON.stringify({ url: report.finalUrl, category: category.id, audit: ref.id, score: audit.score, details: audit.details }));
            }
          }
          JS

      - name: Verify blog PDFs are real files (not LFS pointers)
        run: |
          for f in dist/blog/*/*.pdf; do
            [ -f "$f" ] || continue
            head -c 5 "$f" | grep -q '%PDF-' || {
              echo "Not a valid PDF (LFS pointer?): $f"
              head -3 "$f"
              exit 1
            }
          done

      - name: Write release manifest
        if: inputs.upload-pages-artifact
        run: npm run release:manifest -- --sha="$GITHUB_SHA"

      - name: Upload validated Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
