<line x1="50" y1="365" x2="1050" y2="365" stroke="#d5c8b7" stroke-width="1.5"/>

<!-- Bottom takeaway box -->
<g font-family="Arial,sans-serif">
<text x="50" y="405" font-size="16" font-weight="700" fill="#17324d">Core Empirical Observation:</text>
<text x="50" y="435" font-size="14" fill="#536773">• Across all models and corpus sizes, scores cluster within a narrow 1–2 percentage point band.</text>
<text x="50" y="458" font-size="14" fill="#536773">• Fixed-token chunking remains competitive with or exceeds LLM-generated summaries and contextual headers.</text>
<text x="50" y="481" font-size="14" fill="#536773">• Complex chunking imposes up to 50× indexing slowdowns without delivering statistically reliable recall gains.</text>
</g>
</svg>
